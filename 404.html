<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden | Martlsoft</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a2a66">
  <style>
    :root { --navy:#0a2a66; --blue:#1565c0; --sky:#4fc3f7; --lemon:#fff44f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #fff;
      background: linear-gradient(135deg, #0a2a66 0%, #1565c0 55%, #4fc3f7 100%); }
    .big { font-size: clamp(5rem, 22vw, 10rem); font-weight: 900; line-height: 1; letter-spacing: -.04em;
      background: linear-gradient(90deg, #fff44f, #fff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: .3em 0; }
    p { color: rgba(255,255,255,.85); font-size: 1.1rem; max-width: 460px; margin: 0 auto 28px; }
    a { display: inline-block; background: #fff; color: var(--navy); font-weight: 700; text-decoration: none;
      padding: 14px 26px; border-radius: 999px; box-shadow: 0 10px 24px rgba(0,0,0,.2); }
    .plane { font-size: 3rem; display: inline-block; animation: fly 4s ease-in-out infinite; }
    @keyframes fly { 50% { transform: translate(14px,-10px) rotate(-6deg); } }
    @media (prefers-reduced-motion: reduce) { .plane { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="plane" aria-hidden="true">✈️</div>
    <div class="big">404</div>
    <h1>Hier ist nichts gelandet</h1>
    <p>Diese Seite gibt es leider nicht (mehr). Vielleicht hat sich ein Tippfehler in die Adresse geschlichen.</p>
    <a id="home" href="/">Zur Startseite von Martlsoft</a>
  </main>
  <script>
    // Auf GitHub Pages liegt die Seite unter /martlsoft/, bei IONOS direkt unter /
    if (location.hostname.endsWith("github.io")) document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
  </script>
</body>
</html>
